name: Image Docker

# Construit l'image sur les serveurs de GitHub et la pousse dans ghcr.io.
# Rien ne passe par la machine de développement : ni le build, ni le stockage,
# ni la bande passante. Gratuit et illimité sur un dépôt public.
#
# Deux architectures, chacune construite sur un runner de SA propre architecture
# (GitHub en fournit des arm64 gratuits sur les dépôts publics). Pas d'émulation
# QEMU : c'est plusieurs fois plus rapide, et ça évite les plantages classiques
# de compilation de roues Python sous émulation.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:          # ne pas reconstruire des Go pour une virgule dans un .md
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false     # si arm64 casse, amd64 doit quand même être publié
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm     # Apple Silicon, Raspberry Pi, serveurs Arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni par GitHub, aucun secret à créer

      - name: Construction et publication (par empreinte)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            IRIS_BUILD=${{ github.sha }}
          # Chaque architecture est poussée sans étiquette ; le job suivant les
          # rassemble sous un seul nom. Sinon la seconde écraserait la première.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Conserver l'empreinte
        run: |
          mkdir -p /tmp/digests
          # Le préfixe « sha256: » doit sauter : les deux-points sont interdits
          # dans un nom de fichier d'artefact GitHub. Le job suivant le remet.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Rassemble les deux architectures sous une seule étiquette : `docker pull`
  # choisit alors tout seul la bonne image selon la machine.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Assemblage du manifeste multi-architecture
        working-directory: /tmp/digests
        # Le JSON des étiquettes passe par la variable d'environnement posée par
        # metadata-action, PAS par une interpolation ${{ }} : le JSON contient
        # des parenthèses, que le shell interprète (erreur de syntaxe vécue).
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE_REF@sha256:%s " *)

      - name: Vérification
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
